<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Daily Horoscope</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-white min-h-screen">

    <!-- Loading Screen -->
    <div id="loader"
         class="fixed inset-0 bg-black flex flex-col items-center justify-center z-50">

        <div class="animate-spin rounded-full h-20 w-20 border-t-4 border-pink-500 border-opacity-80">
        </div>

        <p class="mt-6 text-xl text-pink-400 font-semibold">
            Loading Horoscopes...
        </p>
    </div>

    <!-- Main Content -->
    <div id="content" class="hidden">

        <header class="py-10 text-center">
            <h1 class="text-5xl font-bold text-pink-400">
                Daily Horoscope
            </h1>

            <p class="text-gray-400 mt-3">
                Your zodiac insights for today
            </p>
        </header>

        <main class="max-w-7xl mx-auto px-6 pb-10">

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

                {% for horoscope in horoscopes %}

                <div class="bg-gray-900 rounded-2xl p-6 shadow-lg border border-gray-800 hover:border-pink-500 transition">

                    <h2 class="text-2xl font-bold text-pink-400 mb-4">
                        {{ horoscope.name }}
                    </h2>

                    <p class="text-gray-300 leading-relaxed">
                        {{ horoscope.text }}
                    </p>

                </div>

                {% endfor %}

            </div>

        </main>
    </div>

    <script>
        window.addEventListener("load", () => {
            const loader = document.getElementById("loader");
            const content = document.getElementById("content");

            setTimeout(() => {
                loader.classList.add("hidden");
                content.classList.remove("hidden");
            }, 1200);
        });
    </script>

</body>
</html>
