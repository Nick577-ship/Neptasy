<!DOCTYPE html>
<html>
<head>
    <title>Flask on Render</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Hello from Admin on Neptasy 🚀</h1>
    <!-- Sidebar -->
  <div class="sidebar">
    <h2>Admin Panel</h2>

    <ul>
      <li>Dashboard</li>
      <li>Users</li>
      <li>Posts</li>
      <li>Blogs</li>
      <li>Players</li>
      <li>Settings</li>
      <li>Logout</li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main">

    <div class="topbar">
      <h1>Dashboard Overview</h1>
      <div class="admin-profile">Admin</div>
    </div>

    <div class="dashboard-cards">

      <div class="card users">
        <h3>Total Users</h3>
        <div class="number">1,250</div>
      </div>

      <div class="card posts">
        <h3>Total Posts</h3>
        <div class="number">340</div>
      </div>

      <div class="card blogs">
        <h3>Total Blogs</h3>
        <div class="number">128</div>
      </div>

      <div class="card players">
        <h3>Total Players Selected</h3>
        <div class="number">89</div>
      </div>

      <div class="card points">
        <h3>Total Combined Points</h3>
        <div class="number">9,780</div>
      </div>

    </div>

  </div>

</body>
</html>
